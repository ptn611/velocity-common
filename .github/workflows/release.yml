name: release
run-name: release (${{ github.event.head_commit.message }})

on:
  push:
    branches: [master]
    # A prerelease tag such as common-ts-v0.14.0-propamm.0. A release-please tag has no hyphen
    # after the version, so it does not match.
    tags: ['common-ts-v*-*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release-please:
    if: github.ref_type == 'branch'
    runs-on: ubicloud
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      common-ts--release_created: ${{ steps.rp.outputs['common-ts--release_created'] }}
      common-ts--version: ${{ steps.rp.outputs['common-ts--version'] }}
      common-ts--tag_name: ${{ steps.rp.outputs['common-ts--tag_name'] }}
      posthog-types--release_created: ${{ steps.rp.outputs['posthog-types--release_created'] }}
      posthog-types--version: ${{ steps.rp.outputs['posthog-types--version'] }}
      posthog-types--tag_name: ${{ steps.rp.outputs['posthog-types--tag_name'] }}
      icons--release_created: ${{ steps.rp.outputs['icons--release_created'] }}
      icons--version: ${{ steps.rp.outputs['icons--version'] }}
      icons--tag_name: ${{ steps.rp.outputs['icons--tag_name'] }}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-common-ts:
    needs: release-please
    if: ${{ needs.release-please.outputs['common-ts--release_created'] == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing OIDC
    defaults:
      run:
        working-directory: ./common-ts
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs['common-ts--tag_name'] }}

      - uses: ./.github/actions/setup-common-ts
        with:
          registry-url: 'https://registry.npmjs.org'
          working-directory: ./common-ts

      - name: Build
        run: bun run build

      - name: Run tests
        run: bun run test:ci

      - name: Publish to npm
        run: npm publish --access=public --provenance

  # Trusted publishing accepts only this file, so the prerelease path lives here too.
  publish-common-ts-prerelease:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing OIDC
    defaults:
      run:
        working-directory: ./common-ts
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-common-ts
        with:
          registry-url: 'https://registry.npmjs.org'
          working-directory: ./common-ts

      - name: Check the tag against package.json
        id: version
        run: |
          version="${GITHUB_REF_NAME#common-ts-v}"
          pkgver="$(node -p "require('./package.json').version")"
          if [ "$version" != "$pkgver" ]; then
            echo "::error::tag version ($version) != package.json version ($pkgver)"
            exit 1
          fi

          pre="${version#*-}"
          echo "dist_tag=${pre%%.*}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: bun run build

      - name: Run tests
        run: bun run test:ci

      - name: Publish to npm
        run: npm publish --access=public --provenance --tag "${{ steps.version.outputs.dist_tag }}"

  publish-icons:
    needs: release-please
    if: ${{ needs.release-please.outputs['icons--release_created'] == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing OIDC
    defaults:
      run:
        working-directory: ./icons
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs['icons--tag_name'] }}

      - uses: ./.github/actions/setup-common-ts
        with:
          registry-url: 'https://registry.npmjs.org'
          working-directory: ./icons

      - name: Build
        run: bun run build

      - name: Publish to npm
        run: npm publish --access=public --provenance

  publish-posthog-types:
    needs: release-please
    if: ${{ needs.release-please.outputs['posthog-types--release_created'] == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing OIDC
    defaults:
      run:
        working-directory: ./posthog-types
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs['posthog-types--tag_name'] }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --access=public --provenance
